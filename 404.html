<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>404 - Página não encontrada</title>
    <script>
      // Redireciona para a rota principal se a página não existir
      (function() {
        // Salva a rota tentada na sessionStorage para possível redirecionamento
        const attemptedPath = window.location.pathname;
        sessionStorage.setItem('redirectPath', attemptedPath === '/' ? '/' : '/');
        
        // Redireciona para a página principal
        window.location.href = '/';
      })();
    </script>
  </head>
  <body>
    <p>Página não encontrada. Redirecionando...</p>
  </body>
</html>
